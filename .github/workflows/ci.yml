name: frenchcab-deploiement
run-name: docker-build

on:
  push:
    branches:
      - staging

jobs:
  docker-runner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installation des dépendances
        working-directory: ./backend
        run: npm install

      # - name: Lancement des tests
      #   working-directory: ./backend
      #   run: npm test


      - name: Création du fichier .env
        run: touch gateway/.env
        
      - name: Création du fichier .env
        env:
          ENV_CONTENT: ${{ secrets.ENV_EXEMPLE }}
        run: printf '%s\n' "$ENV_CONTENT" > gateway/.env

      - name: Connexion à Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construction des images Docker
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: docker compose build

      - name: Push des images Docker
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: docker compose push
