services:

  backend: 
    image: frenchcab:backend

    # env_file:
    #   - ./backend/.env

    environment:
      - name=value

    ports: 
      - "127.0.0.1:3001:3001"
  
  gateway:
    image: frenchcab:gateway

    # env_file:
    #   - name=value
    
    ports:
      - "3000:3000"
    
  frontend:

    image: frenchcab:frontend

    ports:
      - "127.0.0.1:4200:4200"

    volumes:
      - /app/node_modules

    command: npm start -- --host 0.0.0.0 --port 4200 

